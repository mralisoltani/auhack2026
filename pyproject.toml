[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auhack2026"
version = "0.1.0"
description = "European Power Market Dashboard — AU Hack 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "requests>=2.28",
    "streamlit>=1.28",
    "folium>=0.15.0",
    "streamlit-folium>=0.15.0",
    "markupsafe>=3.0.3",
]

[project.optional-dependencies]
ml-api = [
    "fastapi>=0.100",
    "uvicorn>=0.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dashboard*", "ml_service*"]
